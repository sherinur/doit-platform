syntax = "proto3";

package base.frontend.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/sherinur/doit-platform/apis/gen/base/frontend/v1;frontendv1";

message Feedback {
    string id = 1;
    int64 user_id = 2;
    string course_id = 3;
    string comment = 4;
    int32 rating = 5;  // 1-6
    google.protobuf.Timestamp created_at = 6;
}